<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXSS Assessment Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --paper:#F1F1F1;
    --card:#FFFFFF;
    --page-bg:#FFFFFF;
    --line:#BFBFBF;
    --muted-solid:#5A5A5A;
    --teal:#E64626;
    --amber:#F9A134;
    --green:#007E3B;
    --red:#7A2000;
    --gold:#FFB800;
  }
  *{box-sizing:border-box;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--teal); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg); color:var(--ink); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased; padding:28px 32px 80px;
  }
  .app{max-width:1100px;margin:0 auto;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted-solid);
  }
  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted-solid); margin-bottom:12px;
  }

  .topbar{
    display:flex; align-items:flex-end; gap:14px; padding-bottom:22px; margin-bottom:32px; border-bottom:2px solid var(--ink);
  }
  .brand-mark{ font-family:'Newsreader',serif; font-weight:600; font-size:40px; line-height:1; color:var(--teal); }
  h1{ font-family:'Newsreader',serif; font-weight:500; font-size:30px; margin:2px 0 0; }

  .table-wrap{ background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted-solid); background:var(--paper); padding:10px 14px; border-bottom:1px solid var(--line);
  }
  tbody td{ padding:12px 14px; border-bottom:1px solid var(--paper); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FBFAF7; }
  .unit-name-cell{ font-family:'Newsreader',serif; font-weight:600; font-size:14px; }
  .unit-code-cell{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted-solid); }
  .weight-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 9px; border-radius:20px; display:inline-block;
  }
  .weight-pill.ok{ background:#EDF3F0; color:var(--green); }
  .weight-pill.over{ background:#F6ECE9; color:var(--red); }
  .weight-pill.under{ background:#FBEFE2; color:var(--amber); }
  .open-link{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal); text-decoration:none; white-space:nowrap;
  }
  .open-link:hover{ text-decoration:underline; }
  .empty-state{
    text-align:center; padding:50px 20px; color:var(--muted-solid); font-family:'IBM Plex Mono',monospace; font-size:13px;
  }

  .backend-note{
    background:#FBF0E6; border-left:3px solid var(--amber); padding:12px 16px; border-radius:0 8px 8px 0;
    font-size:12.5px; color:#8A5A24; margin-top:24px; line-height:1.6;
  }

  .scope-grid{ display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
  .scope-card{
    width:250px; padding:22px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .scope-card h2{ font-family:'Newsreader',serif; font-weight:600; font-size:18px; margin:0 0 4px; }
  .scope-sub{ font-size:12px; color:var(--muted-solid); margin:0 0 16px; line-height:1.5; min-height:72px; display:flex; align-items:center; }
  .scope-ring{ position:relative; width:80px; height:80px; flex:none; margin-bottom:10px; }
  .scope-ring svg{ transform:rotate(-90deg); }
  .scope-ring-value{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Newsreader',serif; font-size:18px; font-weight:600;
  }
  .scope-ring-caption{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted-solid); margin-bottom:18px; line-height:1.5; }
  .scope-actions{ display:flex; flex-direction:column; gap:8px; width:100%; }
  .scope-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--teal); text-decoration:none;
    border:1px solid var(--teal); padding:8px 14px; border-radius:7px; white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .scope-btn:hover{ background:var(--teal); color:#fff; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <div class="eyebrow">Dashboard</div>
      <h1>EXSS Assessment Planning</h1>
    </div>
  </div>

  <div id="scopeSections" class="scope-grid"></div>

  <div class="backend-note">
    <strong>Note:</strong> this dashboard reads data saved in this browser only (via local storage). It won't show units entered on a different device or browser, and nothing here is backed up centrally yet.
  </div>
</div>

<script>

// Two scopes only: UG (1000–4000 level) and PG (5000 level) — each with its own Matrix and
// Schedule page, so a unit's code alone decides which section (and which pages) it belongs to.
// totalUnits mirrors the fixed unit count in each page's own catalog (ug_matrix.html /
// pg_matrix.html), since this dashboard only has access to localStorage, not the full catalog.
const SCOPES = [
  {
    key: 'ug',
    title: 'Undergraduate (UG)',
    sub: 'Bachelor of Applied Science (Exercise and Sport Science)<br>Bachelor of Applied Science (Exercise Physiology)',
    matches: code => { const m = code && code.match(/\d/); return m && ["1","2","3","4"].includes(m[0]); },
    matrixPage: 'ug_matrix.html',
    schedulePage: 'ug_schedule.html',
    totalUnits: 40
  },
  {
    key: 'pg',
    title: 'Postgraduate (PG)',
    sub: 'Master of Exercise Physiology',
    matches: code => { const m = code && code.match(/\d/); return m && m[0] === "5"; },
    matrixPage: 'pg_matrix.html',
    schedulePage: 'pg_schedule.html',
    totalUnits: 13
  }
];

function loadUnits(){
  let keys = [];
  try { keys = Object.keys(localStorage).filter(k => k.startsWith('assessmentMatrixUnit:')); }
  catch(e){ return []; }
  return keys.map(k => {
    try { return JSON.parse(localStorage.getItem(k)); }
    catch(e){ return null; }
  }).filter(Boolean).filter(u => u.unitCode);
}

function renderScopeRing(started, total){
  const pct = total > 0 ? Math.round((started / total) * 100) : 0;
  const r = 34, circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - pct / 100);
  return `
    <div class="scope-ring">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--paper)" stroke-width="8"/>
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--teal)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"/>
      </svg>
      <div class="scope-ring-value">${pct}%</div>
    </div>
    <div class="scope-ring-caption">${started} of ${total} units<br>have data entered</div>`;
}

function render(){
  const units = loadUnits();
  const container = document.getElementById('scopeSections');
  container.innerHTML = SCOPES.map(scope => {
    const scopeUnits = units.filter(u => scope.matches(u.unitCode));
    return `
      <div class="scope-card">
        <h2>${scope.title}</h2>
        <div class="scope-sub">${scope.sub}</div>
        ${renderScopeRing(scopeUnits.length, scope.totalUnits)}
        <div class="scope-actions">
          <a class="scope-btn" href="${scope.matrixPage}">Open Matrix →</a>
          <a class="scope-btn" href="${scope.schedulePage}">Open Schedule →</a>
        </div>
      </div>`;
  }).join('');
}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --paper:#F1F1F1;
    --card:#FFFFFF;
    --line:#E0E0E0;
    --muted-solid:#5A5A5A;
    --teal:#E64626;
    --amber:#F9A134;
    --green:#007E3B;
    --red:#7A2000;
    --gold:#FFB800;

    --cat-exam:#7A2000;
    --cat-semtest:#F9A134;
    --cat-inclass:#7F3F98;
    --cat-placement:#25584D;
    --cat-practice:#007E3B;
    --cat-inquiry:#0148A4;
    --cat-production:#D6519D;
    --cat-discussion:#B896C6;
    --cat-attendance:#424242;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased; padding:28px 32px 80px;
  }
  .app{max-width:1400px;margin:0 auto;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted-solid);
  }
  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted-solid); margin-bottom:10px;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end; gap:24px;
    padding-bottom:22px; margin-bottom:24px; border-bottom:2px solid var(--ink); flex-wrap:wrap;
  }
  .brand{display:flex; gap:14px; align-items:flex-end;}
  .brand-mark{ font-family:'Newsreader',serif; font-weight:600; font-size:40px; line-height:1; color:var(--teal); }
  h1{ font-family:'Newsreader',serif; font-weight:500; font-size:28px; margin:2px 0 0; }
  .nav-link{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--teal); text-decoration:none;
    border:1px solid var(--teal); padding:8px 14px; border-radius:7px; white-space:nowrap;
  }
  .nav-link:hover{ background:var(--teal); color:#fff; }

  /* ---------- Buttons ---------- */
  .btn-primary{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px; color:#fff; background:var(--ink);
    border:none; padding:10px 18px; border-radius:7px; cursor:pointer;
  }
  .btn-primary:hover{ background:var(--teal); }
  .btn-ghost{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px; color:var(--ink); background:#fff;
    border:1px solid var(--line); padding:10px 16px; border-radius:7px; cursor:pointer; flex:1;
  }
  .btn-ghost:hover{ border-color:var(--ink); }
  .icon-btn{
    border:1px solid var(--line); background:#fff; border-radius:6px; width:24px; height:24px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11px; color:var(--muted-solid);
  }
  .icon-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .icon-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .confirm-pop{ display:flex; gap:4px; align-items:center; font-family:'IBM Plex Mono',monospace; font-size:10px; }
  .confirm-pop button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:10px; border-radius:5px; padding:3px 6px; cursor:pointer; border:1px solid var(--line);
  }
  .confirm-pop .yes{ background:var(--red); color:#fff; border-color:var(--red); }
  .confirm-pop .no{ background:#fff; color:var(--ink); }

  /* ---------- Toolbar ---------- */
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .toolbar-actions{ display:flex; gap:10px; }

  /* ---------- Group tabs (level codes) ---------- */
  .group-tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .group-tab{
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:9px 15px; border-radius:8px 8px 0 0;
    border:1px solid var(--line); border-bottom:none; background:var(--card); color:var(--muted-solid); cursor:pointer;
  }
  .group-tab .count{ color:var(--muted-solid); margin-left:4px; }
  .group-tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .group-tab.active .count{ color:#D8D3C8; }
  .group-tab:hover:not(.active){ border-color:var(--ink); color:var(--ink); }

  /* ---------- Semester sub-tabs ---------- */
  .semester-tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .semester-tab{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:7px 14px; border-radius:20px;
    border:1px solid var(--line); background:var(--card); color:var(--muted-solid); cursor:pointer;
  }
  .semester-tab .count{ margin-left:4px; color:var(--muted-solid); }
  .semester-tab.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .semester-tab.active .count{ color:#F2E4DE; }
  .semester-tab:hover:not(.active){ border-color:var(--ink); color:var(--ink); }

  /* ---------- Clustering summary ---------- */
  .cluster-banner{
    background:#FBF0E6; border-left:3px solid var(--amber); padding:12px 16px; border-radius:0 8px 8px 0;
    font-size:12.5px; color:#8A5A24; margin-bottom:20px; line-height:1.6;
  }
  .cluster-banner.ok{ background:#EDF3F0; border-left-color:var(--green); color:#2E5A3D; }
  .cluster-banner strong{ font-family:'Newsreader',serif; font-size:14px; }

  /* ---------- Grid ---------- */
  .grid-wrap{ background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; margin-bottom:26px; }
  table.schedule{ border-collapse:collapse; width:100%; font-size:12px; }
  table.schedule th, table.schedule td{ border-bottom:1px solid var(--paper); border-right:1px solid var(--paper); vertical-align:top; }
  table.schedule th:last-child, table.schedule td:last-child{ border-right:none; }

  .week-col-header{
    position:sticky; left:0; background:var(--paper); z-index:2;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted-solid); padding:10px 12px; text-align:left; min-width:120px;
  }
  .week-cell{
    position:sticky; left:0; background:var(--card); z-index:1;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; padding:10px 12px; white-space:nowrap;
  }
  tr.cluster-row .week-cell{ background:#FBF0E6; }
  tr.cluster-row td{ background:#FDF7F0; }

  .unit-th{ padding:10px 12px; min-width:190px; background:var(--paper); vertical-align:top; }
  .unit-name-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .unit-name{ font-family:'Newsreader',serif; font-size:14.5px; font-weight:600; line-height:1.3; }
  .unit-code{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted-solid); margin-top:2px; }
  .unit-coord{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted-solid); margin-top:2px; }
  .unit-total{
    margin-top:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 8px; border-radius:20px; display:inline-block;
  }
  .unit-total.ok{ background:#EDF3F0; color:var(--green); }
  .unit-total.over{ background:#F6ECE9; color:var(--red); }
  .unit-total.under{ background:#FBEFE2; color:var(--amber); }

  .assess-cell{ padding:8px; min-width:190px; }
  .assess-pill{
    background:var(--paper); border-left:3px solid var(--teal); border-radius:0 6px 6px 0;
    padding:6px 8px; margin-bottom:6px; font-size:11.5px; position:relative;
  }
  .assess-pill:last-child{ margin-bottom:0; }
  .assess-pill .cat-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
  .assess-pill .pill-title{ font-weight:600; }
  .assess-pill .pill-meta{ color:var(--muted-solid); font-size:10.5px; margin-top:2px; }
  .assess-pill .pill-actions{ position:absolute; top:5px; right:5px; display:flex; gap:3px; opacity:0; transition:opacity .15s; }
  .assess-pill:hover .pill-actions{ opacity:1; }
  .assess-pill .pill-actions button{
    border:none; background:rgba(255,255,255,.8); border-radius:4px; width:16px; height:16px; font-size:9px;
    cursor:pointer; color:var(--muted-solid); display:flex; align-items:center; justify-content:center;
  }
  .assess-cell-empty{ color:#C7C0B2; font-size:11px; padding:6px 8px; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted-solid); font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .sync-badge{
    font-size:9px; color:var(--teal); margin-left:4px; vertical-align:middle;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--ink); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    padding:12px 20px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:30;
    transition:opacity .2s, transform .2s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Drawer ---------- */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(27,36,48,.35); opacity:0; pointer-events:none; transition:opacity .2s; z-index:20;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw; background:var(--card);
    box-shadow:-10px 0 30px rgba(0,0,0,.12); transform:translateX(100%); transition:transform .25s ease; z-index:21;
    overflow-y:auto; padding:26px 26px 100px;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer h2{ font-family:'Newsreader',serif; font-size:22px; margin:0 0 4px; }
  .drawer .drawer-sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted-solid); margin-bottom:20px; }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted-solid); margin-bottom:5px;
  }
  .field select, .field input{
    width:100%; font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 10px; border:1px solid var(--line);
    border-radius:6px; background:var(--paper); color:var(--ink);
  }
  .field select:focus, .field input:focus{ outline:none; border-color:var(--teal); background:#fff; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .drawer-footer{
    display:flex; gap:10px; padding-top:14px; border-top:1px solid var(--line); margin-top:6px;
  }
  .drawer-footer .btn-primary{ flex:1; }
  .close-x{ position:absolute; top:22px; right:22px; background:none; border:none; font-size:18px; color:var(--muted-solid); cursor:pointer; }

  @media (max-width:900px){ table.schedule{ font-size:11px; } }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <div>
        <h1>Assessment Schedule</h1>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
      <a class="nav-link" href="dashboard.html">☰ Dashboard</a>
      <a class="nav-link" href="assessment_matrix.html">← Unit Assessment Matrix</a>
    </div>
  </div>

  <div class="toolbar" style="justify-content:flex-end;">
    <div class="toolbar-actions">
      <button class="btn-ghost" id="syncBtn" style="flex:none;">↺ Sync from Matrix</button>
      <button class="btn-primary" id="addUnitBtn">+ Add unit</button>
      <button class="btn-primary" id="addAssessBtn">+ Add assessment</button>
    </div>
  </div>

  <div class="group-tabs" id="groupTabs"></div>
  <div class="semester-tabs" id="semesterTabs"></div>

  <div id="clusterBanner"></div>

  <div class="grid-wrap">
    <table class="schedule" id="scheduleTable"></table>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="drawer-overlay" id="overlay"></div>

<div class="drawer" id="unitDrawer">
  <button class="close-x" id="closeUnitDrawer">✕</button>
  <h2 id="unitDrawerTitle">Add unit</h2>
  <div class="drawer-sub">Adds a new column to the schedule grid.</div>
  <div class="field"><label>Unit name</label><input id="u_name" placeholder="e.g. Advanced Professional Practice A"></div>
  <div class="field-row">
    <div class="field"><label>Unit code</label><input id="u_code" placeholder="e.g. PHTY4221"></div>
    <div class="field"><label>Credit points</label><input id="u_credits" placeholder="e.g. 6"></div>
  </div>
  <div class="field"><label>Coordinator</label><input id="u_coordinator" placeholder="Name"></div>
  <div class="drawer-footer">
    <button class="btn-ghost" id="cancelUnitBtn">Cancel</button>
    <button class="btn-primary" id="saveUnitBtn">Save unit</button>
  </div>
</div>

<div class="drawer" id="assessDrawer">
  <button class="close-x" id="closeAssessDrawer">✕</button>
  <h2 id="assessDrawerTitle">Add assessment</h2>
  <div class="drawer-sub">Places an entry in the grid for the chosen unit and week.</div>
  <div class="field"><label>Unit</label><select id="s_unit"></select></div>
  <div class="field"><label>Week</label><select id="s_week"></select></div>
  <div class="field"><label>Category</label><select id="s_category"></select></div>
  <div class="field"><label>Assessment title</label><input id="s_title" placeholder="e.g. Mid-semester practical test"></div>
  <div class="field"><label>Weight (%)</label><input id="s_weight" type="number" min="0" max="100" step="1" value="0"></div>
  <div class="drawer-footer">
    <button class="btn-ghost" id="cancelAssessBtn">Cancel</button>
    <button class="btn-primary" id="saveAssessBtn">Save assessment</button>
  </div>
</div>

// groups[i] = { groupKey, label, units: [{id, name, code, credits, coordinator, session, semester, assessments:[]}] }
let groups = IMPORTED_GROUPS.map(g => ({
  groupKey: g.groupKey,
  label: g.label,
  units: g.units.map(u => ({
    id: nextUnitId++,
    name: u.name,
    code: u.code,
    credits: u.credits,
    coordinator: u.coordinator,
    session: u.session,
    semester: u.semester,
    assessments: []
  }))
}));
let activeGroupIndex = 0;
let activeSemester = 'S1';

const $ = id => document.getElementById(id);
function activeUnits(){
  const group = groups[activeGroupIndex];
  if(!group) return [];
  return group.units.filter(u => (u.semester || 'S1') === activeSemester);
}

function populateStaticSelects(){
  $('s_week').innerHTML = WEEKS.map(w => `<option value="${w}">${w}</option>`).join('');
  $('s_category').innerHTML = Object.entries(CATEGORIES).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
}

function renderGroupTabs(){
  $('groupTabs').innerHTML = groups.map((g,i) => `
    <button class="group-tab ${i===activeGroupIndex?'active':''}" onclick="switchGroup(${i})">
      ${g.label}<span class="count">(${g.units.length})</span>
    </button>`).join('');
  const group = groups[activeGroupIndex];
  const s1count = group ? group.units.filter(u => (u.semester||'S1')==='S1').length : 0;
  const s2count = group ? group.units.filter(u => (u.semester||'S1')==='S2').length : 0;
  $('semesterTabs').innerHTML = `
    <button class="semester-tab ${activeSemester==='S1'?'active':''}" onclick="switchSemester('S1')">Semester 1<span class="count">(${s1count})</span></button>
    <button class="semester-tab ${activeSemester==='S2'?'active':''}" onclick="switchSemester('S2')">Semester 2<span class="count">(${s2count})</span></button>
  `;
}
function switchGroup(i){
  activeGroupIndex = i;
  render();
}
function switchSemester(s){
  activeSemester = s;
  render();
}

// ---------- Sync from Assessment Matrix (via localStorage) ----------
function yearBucket(code){
  const m = code && code.match(/\d+/);
  if(!m) return null;
  const num = parseInt(m[0], 10);
  if(num >= 5000) return 'pg';
  const first = String(num)[0];
  return ['1','2','3','4'].includes(first) ? first : null;
}
function semesterOf(session){
  if(!session) return 'S1';
  if(session.startsWith('S1C')) return 'S1';
  if(session.startsWith('S2C')) return 'S2';
  return 'S1';
}
let toastTimer = null;
function showToast(message){
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}
$('syncBtn').addEventListener('click', () => {
  let keys;
  try {
    keys = Object.keys(localStorage).filter(k => k.startsWith('assessmentMatrixUnit:'));
  } catch(e){ alert('Could not access local storage in this browser.'); return; }

  if(keys.length === 0){
    alert('No Assessment Matrix data found yet. Open the Assessment Matrix page in this same browser (and same site/folder) first, then select and build at least one unit there.');
    return;
  }

  let syncedCount = 0;
  let lastGroupIndex = -1, lastSemester = 'S1', lastName = '';

  keys.forEach(key => {
    let data;
    try { data = JSON.parse(localStorage.getItem(key)); } catch(e){ return; }
    if(!data || !data.unitCode) return;

    const bucket = yearBucket(data.unitCode);
    if(!bucket) return;
    const groupIndex = groups.findIndex(g => g.groupKey === bucket);
    if(groupIndex === -1) return;
    const semester = semesterOf(data.teachingSession);

    const group = groups[groupIndex];
    let unit = group.units.find(u => u.code === data.unitCode);
    if(!unit){
      unit = {
        id: nextUnitId++,
        name: data.unitName || 'Untitled unit',
        code: data.unitCode,
        credits: data.creditPoints || '',
        coordinator: data.coordinator || '',
        session: data.teachingSession || '',
        semester,
        assessments: []
      };
      group.units.push(unit);
    } else {
      unit.name = data.unitName || unit.name;
      unit.credits = data.creditPoints || unit.credits;
      unit.coordinator = data.coordinator || unit.coordinator;
      unit.session = data.teachingSession || unit.session;
      unit.semester = semester;
    }

    // Replace previously-synced entries with the latest from the Matrix page; keep anything added manually here.
    unit.assessments = unit.assessments.filter(a => !a.fromMatrix);
    (data.assessments || []).forEach(a => {
      unit.assessments.push({
        id: nextAssessmentId++,
        week: a.week,
        category: a.category,
        title: a.title,
        weight: a.weight,
        fromMatrix: true
      });
    });

    syncedCount += 1;
    lastGroupIndex = groupIndex;
    lastSemester = semester;
    lastName = unit.name;
  });

  if(syncedCount === 0){
    alert("Found Assessment Matrix data, but couldn't classify any of it into a level group.");
    return;
  }

  if(lastGroupIndex !== -1){
    activeGroupIndex = lastGroupIndex;
    activeSemester = lastSemester;
  }
  render();
  showToast(syncedCount === 1
    ? `Synced "${lastName}" from the Assessment Matrix.`
    : `Synced ${syncedCount} units from the Assessment Matrix.`);
});

// ---------- Unit drawer ----------
function openUnitDrawer(unit){
  editingUnitId = unit ? unit.id : null;
  $('unitDrawerTitle').textContent = unit ? 'Edit unit' : 'Add unit';
  $('u_name').value = unit ? unit.name : '';
  $('u_code').value = unit ? unit.code : '';
  $('u_credits').value = unit ? unit.credits : '';
  $('u_coordinator').value = unit ? unit.coordinator : '';
  $('unitDrawer').classList.add('open');
  $('overlay').classList.add('open');
}
function closeUnitDrawer(){
  $('unitDrawer').classList.remove('open');
  $('overlay').classList.remove('open');
  editingUnitId = null;
}
$('addUnitBtn').addEventListener('click', () => {
  if(groups.length === 0){ alert('No level groups available.'); return; }
  openUnitDrawer(null);
});
$('closeUnitDrawer').addEventListener('click', closeUnitDrawer);
$('cancelUnitBtn').addEventListener('click', closeUnitDrawer);
$('saveUnitBtn').addEventListener('click', () => {
  const name = $('u_name').value.trim();
  if(!name){ alert('Please enter a unit name.'); return; }
  const group = groups[activeGroupIndex];
  if(editingUnitId){
    group.units = group.units.map(u => u.id === editingUnitId ? {...u, name, code:$('u_code').value.trim(), credits:$('u_credits').value.trim(), coordinator:$('u_coordinator').value.trim()} : u);
  } else {
    group.units.push({id: nextUnitId, name, code:$('u_code').value.trim(), credits:$('u_credits').value.trim(), coordinator:$('u_coordinator').value.trim(), session:'', semester: activeSemester, assessments:[]});
    nextUnitId += 1;
  }
  closeUnitDrawer();
  render();
});
function editUnit(id){ const u = activeUnits().find(x=>x.id===id); if(u) openUnitDrawer(u); }
function askDeleteUnit(id){ deleteUnitConfirmId = id; render(); }
function cancelDeleteUnit(){ deleteUnitConfirmId = null; render(); }
function confirmDeleteUnit(id){
  const group = groups[activeGroupIndex];
  group.units = group.units.filter(u=>u.id!==id);
  deleteUnitConfirmId = null;
  render();
}

// ---------- Assessment drawer ----------
function populateUnitSelect(){
  const list = activeUnits();
  $('s_unit').innerHTML = list.length
    ? list.map(u => `<option value="${u.id}">${u.name || 'Untitled unit'}</option>`).join('')
    : '<option value="">Add a unit first…</option>';
}
function openAssessDrawer(unitId, assessment){
  populateUnitSelect();
  const list = activeUnits();
  if(list.length === 0){ alert('Add a unit to this level group first, then add assessments to it.'); return; }
  editingAssessment = assessment ? {unitId, assessmentId: assessment.id} : null;
  $('assessDrawerTitle').textContent = assessment ? 'Edit assessment' : 'Add assessment';
  $('s_unit').value = unitId || list[0].id;
  $('s_week').value = assessment ? assessment.week : WEEKS[0];
  $('s_category').value = assessment ? assessment.category : Object.keys(CATEGORIES)[0];
  $('s_title').value = assessment ? assessment.title : '';
  $('s_weight').value = assessment ? assessment.weight : 0;
  $('assessDrawer').classList.add('open');
  $('overlay').classList.add('open');
}
function closeAssessDrawer(){
  $('assessDrawer').classList.remove('open');
  $('overlay').classList.remove('open');
  editingAssessment = null;
}
$('addAssessBtn').addEventListener('click', () => openAssessDrawer(null, null));
$('closeAssessDrawer').addEventListener('click', closeAssessDrawer);
$('cancelAssessBtn').addEventListener('click', closeAssessDrawer);
$('saveAssessBtn').addEventListener('click', () => {
  const unitId = parseInt($('s_unit').value, 10);
  const unit = activeUnits().find(u => u.id === unitId);
  if(!unit){ alert('Please choose a unit.'); return; }
  const title = $('s_title').value.trim();
  if(!title){ alert('Please enter an assessment title.'); return; }
  const record = {
    id: editingAssessment ? editingAssessment.assessmentId : nextAssessmentId,
    week: $('s_week').value,
    category: $('s_category').value,
    title,
    weight: parseFloat($('s_weight').value) || 0
  };
  if(editingAssessment){
    const oldUnit = activeUnits().find(u => u.id === editingAssessment.unitId);
    if(oldUnit) oldUnit.assessments = oldUnit.assessments.filter(a => a.id !== editingAssessment.assessmentId);
    unit.assessments.push(record);
  } else {
    unit.assessments.push(record);
    nextAssessmentId += 1;
  }
  closeAssessDrawer();
  render();
});
function editAssessment(unitId, assessmentId){
  const unit = activeUnits().find(u => u.id === unitId);
  const a = unit && unit.assessments.find(x => x.id === assessmentId);
  if(a) openAssessDrawer(unitId, a);
}
function askDeleteAssessment(unitId, assessmentId){ deleteAssessmentConfirm = {unitId, assessmentId}; render(); }
function cancelDeleteAssessment(){ deleteAssessmentConfirm = null; render(); }
function confirmDeleteAssessment(unitId, assessmentId){
  const unit = activeUnits().find(u => u.id === unitId);
  if(unit) unit.assessments = unit.assessments.filter(a => a.id !== assessmentId);
  deleteAssessmentConfirm = null;
  render();
}

$('overlay').addEventListener('click', () => { closeUnitDrawer(); closeAssessDrawer(); });

// ---------- Rendering ----------
function render(){
  renderGroupTabs();
  const units = activeUnits();
  const table = $('scheduleTable');
  if(units.length === 0){
    table.innerHTML = '';
    document.querySelector('.grid-wrap').innerHTML = '<div class="empty-state">No units in this level group yet — click "+ Add unit" to add one.</div>';
    $('clusterBanner').innerHTML = '';
    return;
  }
  if(!document.getElementById('scheduleTable')){
    document.querySelector('.grid-wrap').innerHTML = '<table class="schedule" id="scheduleTable"></table>';
  }
  const tbl = $('scheduleTable');

  // Header rows
  let thead = `<thead><tr><th class="week-col-header">Week</th>`;
  units.forEach(u => {
    const total = u.assessments.reduce((s,a)=>s+a.weight,0);
    const totalClass = total === 100 ? 'ok' : (total > 100 ? 'over' : 'under');
    const unitActions = deleteUnitConfirmId === u.id
      ? `<div class="confirm-pop"><span>Remove?</span><button class="yes" onclick="confirmDeleteUnit(${u.id})">Yes</button><button class="no" onclick="cancelDeleteUnit()">No</button></div>`
      : `<div style="display:flex; gap:4px;">
           <button class="icon-btn" title="Edit" onclick="editUnit(${u.id})">✎</button>
           <button class="icon-btn danger" title="Delete" onclick="askDeleteUnit(${u.id})">🗑</button>
         </div>`;
    thead += `
      <th class="unit-th">
        <div class="unit-name-row">
          <div>
            <div class="unit-name">${u.name || 'Untitled unit'}</div>
            <div class="unit-code">${u.code || '—'}${u.credits ? ' · ' + u.credits + ' cp' : ''}</div>
            ${u.coordinator ? `<div class="unit-coord">${u.coordinator}</div>` : ''}
          </div>
          ${unitActions}
        </div>
        <span class="unit-total ${totalClass}">${total}%</span>
      </th>`;
  });
  thead += '</tr></thead>';

  // Body rows — one per week, flag weeks where 2+ units have an assessment (clustering).
  let clusterWeeks = [];
  let tbody = '<tbody>';
  WEEKS.forEach(week => {
    const unitsWithAssessment = units.filter(u => u.assessments.some(a => a.week === week));
    const isCluster = unitsWithAssessment.length >= 2;
    if(isCluster) clusterWeeks.push({week, count: unitsWithAssessment.length});
    tbody += `<tr class="${isCluster ? 'cluster-row' : ''}"><td class="week-cell">${week}${isCluster ? ' ⚠' : ''}</td>`;
    units.forEach(u => {
      const items = u.assessments.filter(a => a.week === week);
      if(items.length === 0){
        tbody += `<td class="assess-cell"><div class="assess-cell-empty">—</div></td>`;
      } else {
        const pills = items.map(a => {
          const cat = CATEGORIES[a.category];
          const actionsHtml = (deleteAssessmentConfirm && deleteAssessmentConfirm.unitId === u.id && deleteAssessmentConfirm.assessmentId === a.id)
            ? `<div class="confirm-pop" style="position:absolute; top:4px; right:4px;"><button class="yes" onclick="confirmDeleteAssessment(${u.id},${a.id})">Y</button><button class="no" onclick="cancelDeleteAssessment()">N</button></div>`
            : `<div class="pill-actions">
                 <button title="Edit" onclick="editAssessment(${u.id},${a.id})">✎</button>
                 <button title="Delete" onclick="askDeleteAssessment(${u.id},${a.id})">🗑</button>
               </div>`;
          return `
            <div class="assess-pill" style="border-left-color:${cat ? cat.color : 'var(--teal)'};">
              ${actionsHtml}
              <div class="pill-title"><span class="cat-dot" style="background:${cat ? cat.color : 'var(--teal)'};"></span>${a.title}${a.fromMatrix ? '<span class="sync-badge" title="Synced from the Assessment Matrix page">↺</span>' : ''}</div>
              <div class="pill-meta">${cat ? cat.label : ''} · ${a.weight}%</div>
            </div>`;
        }).join('');
        tbody += `<td class="assess-cell">${pills}</td>`;
      }
    });
    tbody += '</tr>';
  });
  tbody += '</tbody>';

  tbl.innerHTML = thead + tbody;

  // Clustering summary banner
  const banner = $('clusterBanner');
  if(clusterWeeks.length === 0){
    banner.innerHTML = `<div class="cluster-banner ok"><strong>No clustering detected.</strong> No week currently has assessments due in two or more units at once.</div>`;
  } else {
    banner.innerHTML = `<div class="cluster-banner"><strong>${clusterWeeks.length} week${clusterWeeks.length===1?'':'s'} flagged for clustering.</strong> ${clusterWeeks.map(c => `${c.week} (${c.count} units)`).join(', ')} — students in overlapping units may face multiple deadlines at once.</div>`;
  }
}

populateStaticSelects();
render();
</script>
